<script>
/* ========================================= */
/* Render MathJax dans UN container         */
/* MÊME LOGIQUE que question-enonce         */
/* ========================================= */
window.renderMathJaxInContainer = async function (containerId, text) {
  const container = document.getElementById(containerId);
  
  if (!container) {
    console.warn(`⚠️ ${containerId} introuvable`);
    return;
  }

  // Si texte vide, vider et sortir
  if (!text || text.trim() === '') {
    container.innerHTML = '';
    return;
  }

  // 1️⃣ Nettoyage TOTAL
  if (window.MathJax?.typesetClear) {
    try {
      MathJax.typesetClear([container]);
    } catch(e) {}
  }

  // 2️⃣ Injection TEXTE BRUT
  container.innerHTML = '';
  container.textContent = text;

  // 3️⃣ Attendre MathJax
  if (!window.MathJax?.typesetPromise) {
    return;
  }

  // 4️⃣ RENDU MATHJAX
  try {
    await MathJax.typesetPromise([container]);
  } catch(e) {
    console.error(`❌ ${containerId}:`, e);
  }
};

/* ========================================= */
/* Render TOUTES les zones SÉQUENTIELLEMENT */
/* ========================================= */
window.renderAllMathJaxZones = async function (questionEnonce, stickyParentEnonce, choicesArray) {
  if (!window.MathJax?.typesetPromise) {
    setTimeout(() => window.renderAllMathJaxZones(questionEnonce, stickyParentEnonce, choicesArray), 100);
    return;
  }

  try {
    // 1️⃣ Question
    await window.renderMathJaxInContainer('question-enonce', questionEnonce);

    // 2️⃣ Sticky parent
    await window.renderMathJaxInContainer('sticky-parent-enonce', stickyParentEnonce);

    // 3️⃣ Choices A → E (SÉQUENTIELLEMENT)
    if (choicesArray && Array.isArray(choicesArray)) {
      const labels = ['A', 'B', 'C', 'D', 'E'];
      
      for (const label of labels) {
        const choice = choicesArray.find(c => c.choice_label === label);
        const choiceText = choice?.choice_text || '';
        
        await window.renderMathJaxInContainer(`choice-${label}`, choiceText);
      }
    }

  } catch (error) {
    console.error('❌ renderAllMathJaxZones:', error);
  }
};

/* Compatibilité legacy */
window.renderMathJaxQuestion = async function (enonce) {
